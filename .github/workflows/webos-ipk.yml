name: Build LG webOS IPK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'webos-source.tar.xz'
      - 'site-assets/patch_v061_phone.py'
      - 'site-assets/mobile-symbol-v061.test.cjs'
      - 'site-assets/grade_photo_v06.py'
      - '.github/workflows/webos-ipk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract base v0.6 webOS source
        run: |
          tar -xJf webos-source.tar.xz
          test -f webos/post-prayer-adhkar.json
          test -f webos/hadiths.json
          python -c "import json; a=json.load(open('webos/appinfo.json')); assert a['version']=='0.6.0' and a['id']=='com.alkitabmawqut.tv'"
      - name: Apply mobile-off icon and verified salam variant
        run: |
          python site-assets/patch_v061_phone.py
          cp site-assets/mobile-symbol-v061.test.cjs webos/tests/mobile-symbol-v061.test.cjs
      - name: Check live display code and run scheduling/design tests
        run: |
          node --check webos/main.js
          node --check webos/prayer-core.js
          node --test webos/tests/*.test.cjs
      - name: Retrieve CC0 original 4K Kaaba photo
        run: |
          curl --fail -L --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 150 --user-agent 'AlKitabMawqut/0.6 (prayer display)' 'https://commons.wikimedia.org/wiki/Special:FilePath/Kaaba_Al-Musharrafah.jpg' -o webos/assets/kaaba-4k.jpg
          test "$(stat -c %s webos/assets/kaaba-4k.jpg)" -gt 2000000
      - name: Color-grade at original photo resolution (no upscaling)
        run: |
          python -m pip install --disable-pip-version-check --quiet numpy pillow
          python site-assets/grade_photo_v06.py
          rm -f webos/assets/kaaba-4k.jpg
      - name: Install LG webOS CLI
        run: npm install -g @webos-tools/cli
      - name: Build installation package
        run: |
          ares-config -p tv
          rm -rf webos/tests webos/hadiths.json webos/post-prayer-adhkar.json
          mkdir -p dist
          ares-package webos -o dist
          ls -lh dist/*.ipk
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Kitab-Al-Mawqut-LG-webOS-v0.6.1-IPK
          path: dist/*.ipk
          if-no-files-found: error
