name: Build LG webOS IPK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'webos-source.tar.xz'
      - '.github/workflows/webos-ipk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract source
        run: |
          tar -xJf webos-source.tar.xz
          test -f webos/hadiths.json
          test -f webos/appinfo.json
      - name: Test hadith provenance, prayer calculations, layout and remote settings
        run: |
          node --check webos/main.js
          node --check webos/prayer-core.js
          node --test webos/tests/*.test.cjs
          node -e "const a=require('./webos/hadiths.json');console.log('Sahihayn hadiths:',a.length)"
      - name: Fetch CC0 Kaaba background
        run: |
          mkdir -p webos/assets
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 150 --user-agent 'AlKitabMawqut/0.4 (mosque prayer display)' 'https://commons.wikimedia.org/wiki/Special:FilePath/Kaaba_Al-Musharrafah.jpg' -o webos/assets/kaaba-4k.jpg
          file webos/assets/kaaba-4k.jpg
          test $(stat -c %s webos/assets/kaaba-4k.jpg) -gt 2000000
      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli
      - name: Build webOS installation package
        run: |
          ares-config -p tv
          rm -rf webos/tests webos/hadiths.json
          mkdir -p dist
          ares-package webos -o dist
          test -n "$(find dist -name '*.ipk' -type f -print -quit)"
          ls -lh dist/*.ipk
      - uses: actions/upload-artifact@v4
        with:
          name: Al-Kitab-Al-Mawqut-LG-webOS-v0.4.0-IPK
          path: dist/*.ipk
          if-no-files-found: error
